[project]
name = "bulwark"
version = "3.0.0"
description = "Pre-Deployment Production Simulation Agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "motor>=3.7.0",
    "pymongo>=4.10.0",
    "mcp>=1.27.0",
    "sse-starlette>=2.1.0",
    "google-cloud-pubsub>=2.28.0",
    "google-cloud-storage>=2.19.0",
    "google-cloud-run>=0.10.0",
    "google-cloud-artifact-registry>=1.14.0",
    "google-cloud-build>=3.31.0",
    "google-cloud-secret-manager>=2.22.0",
    "google-genai>=1.14.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.setuptools.packages.find]
include = ["shared*", "orchestrator*", "tests*", "webhook_receiver*", "environment_builder*", "traffic_replay*", "verdict_writer*"]
exclude = ["terraform*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
