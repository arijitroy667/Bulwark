# ============================================================
# Bulwark — Docker Compose (Local Development)
# ============================================================
# Start the full local stack with: docker compose up --build
# Then: python scripts/run_demo.py   (or the dashboard: npm run dev --prefix dashboard)
# ============================================================

services:
  # ── MongoDB ──
  mongodb:
    image: mongo:7.0
    container_name: bulwark-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: bulwark
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── WireMock (dependency mocking) ──
  wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: bulwark-wiremock
    ports:
      - "8082:8080"
    command: --verbose --global-response-templating
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Webhook Receiver ──
  webhook-receiver:
    build:
      context: .
      dockerfile: webhook_receiver/Dockerfile
    container_name: bulwark-webhook
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - BULWARK_MODE=development
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=bulwark
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Orchestrator: dashboard API + MongoDB queue consumer + demo-mode simulations ──
  # Demo mode runs the local demo-app as the ephemeral environment against the
  # WireMock above, so the full pipeline works without GCP/Dynatrace accounts.
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: bulwark-orchestrator
    ports:
      - "8000:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - BULWARK_MODE=development
      - BULWARK_DEMO_MODE=true
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=bulwark
      - WIREMOCK_BASE_URL=http://wiremock:8080
    depends_on:
      mongodb:
        condition: service_healthy
      wiremock:
        condition: service_healthy

volumes:
  mongodb_data:
    driver: local
